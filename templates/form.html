{% extends "base.html" %}
{% block content %}
<h1>{{ 'Редагування книги' if book else 'Нова книга' }}</h1>
<form method="post">
  <label>Назва <br><input name="title" required value="{{ book.title if book else '' }}"></label>
  <label>Автор <br><input name="author" required value="{{ book.author if book else '' }}"></label>
  <label>Жанр <br><input name="genre" value="{{ book.genre or '' if book else '' }}"></label>
  <label>Рік видання <br><input name="year" type="number" value="{{ book.year or '' if book else '' }}"></label>
  <label>Кількість сторінок <br><input name="pages" type="number" value="{{ book.pages or '' if book else '' }}"></label>
  <label>Статус <br>
    <select name="status">
      {% for s in statuses %}
      <option {{ 'selected' if book and book.status == s else '' }}>{{ s }}</option>
      {% endfor %}
    </select>
  </label>
  <p><button type="submit">Зберегти</button> <a href="{{ url_for('index') }}">Скасувати</a></p>
</form>
{% endblock %}
