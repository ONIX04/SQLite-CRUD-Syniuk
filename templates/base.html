<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <title>Домашня бібліотека</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px auto; max-width: 960px; color: #222; }
    h1 { margin-bottom: 4px; }
    a.button, button { background: #2d6cdf; color: #fff; border: none; padding: 6px 12px;
                       border-radius: 4px; text-decoration: none; cursor: pointer; font-size: 14px; }
    button.danger { background: #d9534f; }
    table { border-collapse: collapse; width: 100%; margin-top: 16px; }
    th, td { border: 1px solid #ccc; padding: 6px 8px; text-align: left; }
    th { background: #f0f0f0; }
    form.inline { display: inline; }
    label { display: block; margin-top: 10px; }
    input, select { width: 320px; padding: 5px; }
  </style>
</head>
<body>
  {% block content %}{% endblock %}
</body>
</html>
